name: Send Proxies to Telegram

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          #!/bin/bash
          set -e

          # ترکیب همه فایل‌های پروکسی
          cat proxy_ru.txt proxy_eu.txt proxy_us.txt proxy_asia.txt socks5.txt 2>/dev/null | grep '^tg://' > /tmp/all_proxies.txt || true

          if [ ! -s /tmp/all_proxies.txt ]; then
            grep '^tg://' proxy_all_mtproto.txt > /tmp/all_proxies.txt 2>/dev/null || true
          fi

          if [ ! -s /tmp/all_proxies.txt ]; then
            echo "No proxies found."
            exit 1
          fi

          # ارسال ۳ پروکسی اول به صورت جداگانه
          for i in 1 2 3; do
            PROXY=$(sed -n "${i}p" /tmp/all_proxies.txt)
            if [ -z "$PROXY" ]; then continue; fi

            MESSAGE="🔥 متصل بمانید!
          <a href=\"$PROXY\">Connect</a>

          @KhabarNab"

            jq -n \
              --arg chat_id "$CHAT_ID" \
              --arg text "$MESSAGE" \
              '{chat_id: $chat_id, text: $text, parse_mode: "HTML", disable_web_page_preview: true}' > /tmp/payload.json

            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
              -H "Content-Type: application/json" \
              -d @/tmp/payload.json
          done
