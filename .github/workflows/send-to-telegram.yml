name: Send Proxies to Telegram

on:
  schedule:
    - cron: '*/2 * * * *'  # هر 2 دقیقه
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          #!/bin/bash
          # پیدا کردن اولین پروکسی معتبر از فایل (خطوطی که با # شروع نمی‌شن)
          PROXY1=$(grep -v '^#' proxy_ru.txt | head -n 1)
          PROXY2=$(grep -v '^#' proxy_ru.txt | head -n 2 | tail -n 1)
          PROXY3=$(grep -v '^#' proxy_ru.txt | head -n 3 | tail -n 1)

          # ساخت متن با HTML (برای کلیک‌پذیر شدن)
          MESSAGE="متصل بمانید! 🔥
          <a href=\"$PROXY1\">proxy 1</a>
          <a href=\"$PROXY2\">proxy 2</a>
          <a href=\"$PROXY3\">proxy 3</a>

          @KhabarNab"

          # ارسال با HTML
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d "chat_id=$CHAT_ID" \
            -d "text=$MESSAGE" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"
